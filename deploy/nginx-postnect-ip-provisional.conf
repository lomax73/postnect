# Finché non c'è un dominio DNS vero, servito sull'IP nudo del VPS su una
# porta dedicata (mai condivisa con altre app — vedi struttura_app_fbo.md
# per l'elenco delle porte già occupate). Verificare 8453 libera sul VPS
# prima del primo deploy; se occupata, sceglierne una libera e aggiornarla
# anche qui e in questo commento.
server {
    listen 8453 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/postnect/selfsigned.crt;
    ssl_certificate_key /etc/ssl/postnect/selfsigned.key;

    location /api/internal/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://unix:/run/postnect/gunicorn.sock;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /opt/postnect/app/staticfiles/;
    }

    location /media/ {
        alias /opt/postnect/app/media/;
    }

    location / {
        proxy_pass http://unix:/run/postnect/gunicorn.sock;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
