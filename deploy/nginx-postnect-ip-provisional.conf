# Finché non c'è un dominio DNS vero, servito sull'IP nudo del VPS su una
# porta dedicata (mai condivisa con altre app). Verificato sul VPS il
# 2026-09-04: 8443-8453 già occupate (Portale, FiberReport, Preventivi,
# RackReport, NetVault, Squadfy, MKRemote, FBOMailer, FBOLeads, FBOAIGate,
# Sicufy), 8454 libera — vedi struttura_app_fbo.md per il dettaglio.
server {
    listen 8454 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/postnect/selfsigned.crt;
    ssl_certificate_key /etc/ssl/postnect/selfsigned.key;

    location /api/internal/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://unix:/run/postnect/gunicorn.sock;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /opt/postnect/app/staticfiles/;
    }

    location /media/ {
        alias /opt/postnect/app/media/;
    }

    location / {
        proxy_pass http://unix:/run/postnect/gunicorn.sock;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
