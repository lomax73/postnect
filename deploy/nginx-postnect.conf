# Template "finale" a sottodominio, da attivare quando il dominio è pronto
# (vedi deploy/README.md — migrazione identica a quella già fatta per
# Squadfy/Portal: DNS su Aruba, certbot --nginx -d postnect.fbosolution.it).
server {
    listen 80;
    server_name postnect.fbosolution.it;

    location /api/internal/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://unix:/run/postnect/gunicorn.sock;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /opt/postnect/app/staticfiles/;
    }

    location /media/ {
        alias /opt/postnect/app/media/;
    }

    location / {
        proxy_pass http://unix:/run/postnect/gunicorn.sock;
        # $http_host (non $host): include la porta se non standard, altrimenti
        # il controllo CSRF di Django fallisce per mismatch Host/Referer.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
