# Vhost finale a sottodominio (in produzione dal 2026-09-06).
# Migrato da nginx-postnect-ip-provisional.conf dopo la propagazione DNS di
# postnect.fbosolution.it. Vedi deploy/README.md per la procedura completa.
# Il redirect HTTP→HTTPS e il challenge ACME stanno in nginx-postnect-80.conf.
#
# ATTENZIONE al passaggio dal provvisorio: il vecchio vhost aveva
# `listen 8454 ssl` su 0.0.0.0, questo ha `listen 127.0.0.1:8454`. Un
# semplice `systemctl reload nginx` NON basta (il worker vecchio tiene la
# porta, il reload fallisce in silenzio): serve `systemctl restart nginx`.

# Vhost pubblico.
server {
    listen 443 ssl;
    server_name postnect.fbosolution.it;

    ssl_certificate     /etc/letsencrypt/live/postnect.fbosolution.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postnect.fbosolution.it/privkey.pem;

    client_max_body_size 5M;

    location /static/ {
        alias /opt/postnect/app/staticfiles/;
    }

    location /media/ {
        alias /opt/postnect/app/media/;
    }

    location / {
        proxy_pass http://unix:/run/postnect/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Vhost interno, solo loopback: usato dal Portale FBO per l'anagrafica
# clienti e la gestione utenti (/api/internal/). Resta sulla porta dedicata
# 8454 (bind esplicito su 127.0.0.1, non più 0.0.0.0 — la porta è stata
# chiusa su UFW dopo la migrazione).
server {
    listen 127.0.0.1:8454 ssl;
    server_name 127.0.0.1;

    ssl_certificate     /etc/letsencrypt/live/postnect.fbosolution.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postnect.fbosolution.it/privkey.pem;

    location /api/internal/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://unix:/run/postnect/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
