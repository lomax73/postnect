# Vhost porta 80: challenge ACME (rinnovo certificato) + redirect a HTTPS.
# Stesso pattern di fbomailer-80/fboleads-80 sul VPS.
server {
    listen 80;
    server_name postnect.fbosolution.it;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
